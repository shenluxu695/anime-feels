<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAuth Callback - Anime Feels</title>
<link rel="icon" type="image/svg+xml" href="/favicon.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0b0b12; color:#e0e0e0; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.card { background:#14141e; border-radius:16px; padding:40px; max-width:460px; width:100%; border:1px solid #1e1e2e; text-align:center; }
.icon { font-size:48px; margin-bottom:15px; }
h1 { font-size:1.4em; margin-bottom:8px; background:linear-gradient(135deg,#ff6b6b,#667eea); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
p { color:#888; font-size:14px; line-height:1.6; }
code { background:#1a1a24; padding:2px 6px; border-radius:4px; font-size:12px; color:#ff6b6b; display:block; margin:6px 0; }
.btn { display:inline-block; margin-top:20px; background:linear-gradient(135deg,#ff6b6b,#667eea); color:#fff; padding:10px 24px; border-radius:8px; text-decoration:none; font-size:14px; }
.success { color:#3fb950 }
.error { color:#ff5f57 }
</style>
</head>
<body>
<div class="card" id="content">
  <div class="icon">🔄</div>
  <h1>Processing OAuth Callback...</h1>
  <p>Completing TikTok authorization.</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');
const content = document.getElementById('content');

if (code) {
  content.innerHTML = `
    <div class="icon">✅</div>
    <h1 class="success">Authorization Successful!</h1>
    <p>TikTok account connected successfully.</p>
    <code>✓ Authorization code received</code>
    <code>✓ In production: exchanging for access token...</code>
    <code>✓ Scopes: user.info.basic, video.upload</code>
    <p style="margin-top:12px;font-size:12px;color:#555">Sandbox environment | @animefeels_test</p>
    <a href="/production.html" class="btn">📤 Post a Video</a>
  `;
} else if (error) {
  content.innerHTML = `
    <div class="icon">❌</div>
    <h1 class="error">Authorization Failed</h1>
    <p>Error: ${error}</p>
    <a href="/oauth_test.html" class="btn">Try Again</a>
  `;
} else {
  content.innerHTML = `
    <div class="icon">🔗</div>
    <h1>Ready to Connect</h1>
    <p>Click below to start TikTok authorization.</p>
    <a href="/oauth_test.html" class="btn">Connect TikTok</a>
  `;
}
</script>
</body>
</html>
